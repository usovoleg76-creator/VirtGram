<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>VirtGram</title>
<style>
:root{--bg:#101010;--panel:#181818;--line:#2b2b2b;--text:#f4f4f4;--muted:#999;--accent:#ff7900}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui;height:100dvh}button,input{font:inherit}button{cursor:pointer;border:0}.app{height:100dvh;max-width:1100px;margin:auto;display:flex;overflow:hidden}.sidebar{width:340px;border-right:1px solid var(--line);background:#141414}.top,.header{padding:15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.top{justify-content:space-between}.brand{font-size:22px;font-weight:800}.brand span{color:var(--accent)}.icon{background:#252525;color:white;border-radius:12px;padding:10px}.search{margin:12px;width:calc(100% - 24px);padding:12px;border-radius:12px;background:#222;color:white;border:1px solid var(--line)}.chat{padding:14px;border-bottom:1px solid #222;cursor:pointer}.chat:hover{background:#25201b}.main{flex:1;display:flex;flex-direction:column;min-width:0}.welcome{margin:auto;text-align:center;color:var(--muted)}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}.bubble{padding:10px 14px;background:#252525;border-radius:15px;max-width:80%;align-self:flex-start;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#713600}.composer{display:flex;padding:12px;gap:8px;border-top:1px solid var(--line)}.composer input,.auth input{flex:1;min-width:0;padding:13px;border-radius:22px;border:1px solid #383838;background:#222;color:white}.send,.primary{background:var(--accent);color:#111;font-weight:700;padding:12px 18px;border-radius:14px}.authwrap{position:fixed;inset:0;background:#101010;display:grid;place-items:center;padding:20px;z-index:3}.auth{width:min(420px,100%);background:#181818;padding:24px;border:1px solid #333;border-radius:20px}.auth input{display:block;width:100%;margin:10px 0;border-radius:12px}.auth h2 span{color:var(--accent)}.auth button{width:100%;margin-top:8px}.secondary{background:none;color:#ff9b38;padding:12px}.error{color:#ff927c;font-size:13px;overflow-wrap:anywhere}.small{color:#999;font-size:12px}@media(max-width:650px){.sidebar{width:100%}.main{display:none}.app.show-chat .sidebar{display:none}.app.show-chat .main{display:flex}}
</style></head><body>
<div class="authwrap" id="authwrap"><div class="auth"><h2>Virt<span>Gram</span></h2><p class="small">Войди или создай аккаунт.</p><input id="email" type="email" placeholder="Электронная почта"><input id="password" type="password" placeholder="Пароль (минимум 6 символов)"><div class="error" id="err"></div><button class="primary" id="login">Войти</button><button class="secondary" id="register">Создать аккаунт</button></div></div>
<div class="app" id="app" hidden><aside class="sidebar"><div class="top"><div class="brand">Virt<span>Gram</span></div><div><button class="icon" id="new">＋</button><button class="icon" id="logout">Выйти</button></div></div><input class="search" id="search" placeholder="Поиск чатов"><div id="chatlist"></div></aside><main class="main" id="main"><div class="welcome"><h2>Добро пожаловать в VirtGram</h2><p>Нажми ＋, чтобы начать чат.</p></div></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,collection,addDoc,query,where,orderBy,onSnapshot,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD0adf3f7qVqsPbozEjjUiengVLZrfoCDU",authDomain:"virtgram.firebaseapp.com",projectId:"virtgram",storageBucket:"virtgram.firebasestorage.app",messagingSenderId:"538432900680",appId:"1:538432900680:web:e33ef5b6f76569a093d27d",measurementId:"G-P9WYDQK1V1"};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),$=id=>document.getElementById(id);let me=null,stopList=null,stopMessages=null;
$("login").onclick=async()=>{try{$("err").textContent="";await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("err").textContent=e.message}};
$("register").onclick=async()=>{try{$("err").textContent="";const c=await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,email:c.user.email,createdAt:serverTimestamp()})}catch(e){$("err").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{me=u;$("authwrap").hidden=!!u;$("app").hidden=!u;if(u){await setDoc(doc(db,"users",u.uid),{uid:u.uid,email:u.email},{merge:true});watchChats()}else{if(stopList)stopList();if(stopMessages)stopMessages()}});
function watchChats(){stopList=onSnapshot(query(collection(db,"chats"),where("members","array-contains",me.uid)),s=>{const box=$("chatlist");box.innerHTML="";s.forEach(d=>{const c=d.data(),other=(c.memberEmails||[]).find(e=>e!==me.email)||"Чат",el=document.createElement("div");el.className="chat";el.textContent=other+" — "+(c.lastMessage||"Начните общение");el.onclick=()=>openChat(d.id,other);box.append(el)})},e=>alert(e.message))}
async function newChat(){const email=prompt("Введи точную почту другого пользователя VirtGram:");if(!email)return;const q=query(collection(db,"users"),where("email","==",email.trim().toLowerCase())),res=await getDocs(q);if(res.empty){alert("Пользователь не найден. Сначала он должен зарегистрироваться.");return}let target;res.forEach(x=>target=x.data());if(target.uid===me.uid){alert("Нельзя создать чат с самим собой.");return}const members=[me.uid,target.uid].sort(),id=members.join("_");await setDoc(doc(db,"chats",id),{members,memberEmails:[me.email,target.email],lastMessage:"",createdAt:serverTimestamp()},{merge:true});openChat(id,target.email)}
async function openChat(id,title){if(stopMessages)stopMessages();$("app").classList.add("show-chat");$("main").innerHTML='<div class="header"><b></b></div><div class="messages" id="msgs"></div><form class="composer" id="form"><input id="msg" placeholder="Сообщение..." maxlength="2000"><button class="send">➤</button></form>';$("main").querySelector("b").textContent=title;stopMessages=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc")),s=>{const box=$("msgs");box.innerHTML="";s.forEach(d=>{const m=d.data(),el=document.createElement("div");el.className="bubble"+(m.senderId===me.uid?" mine":"");el.textContent=m.text;box.append(el)});box.scrollTop=box.scrollHeight},e=>alert(e.message));$("form").onsubmit=async e=>{e.preventDefault();const input=$("msg"),text=input.value.trim();if(!text)return;input.value="";try{await addDoc(collection(db,"chats",id,"messages"),{text,senderId:me.uid,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",id),{lastMessage:text,updatedAt:serverTimestamp()},{merge:true})}catch(err){alert(err.message)}}}
$("new").onclick=()=>newChat().catch(e=>alert(e.message));$("search").oninput=()=>{const v=$("search").value.toLowerCase();[...$("chatlist").children].forEach(x=>x.style.display=x.textContent.toLowerCase().includes(v)?"block":"none")};
</script></body></html>
